name: Android Debug APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Use runner Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - name: Prepare unchanged Cindrix logo
        run: |
          python -m pip install pillow
          python scripts/generate_icons.py
      - name: Unit tests and Android APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cindrix-Overwatch-Cam-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
